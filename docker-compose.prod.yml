version: '3.8'

# ── Mega-Scale Production Architecture (Tuned for 4+ CPU & High Concurrency) ──
# Handles tens of thousands of active concurrent users with Zero Lag.

services:
  # 1. High Performance Nginx Gateway & SSL Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nandha_nginx_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-challenge:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - production_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # 2. FastAPI ASGI Cluster (Scalable: 8 Workers for 4-CPU, 16 Workers for 8-CPU)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nandha_fastapi_cluster
    restart: always
    expose:
      - "8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      # On 4-CPU use 8; on 8-CPU set WEB_CONCURRENCY=16 (2 workers per physical core)
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-16}
      - DATABASE_URL=postgresql://platform_user:SuperSecretPass2026@postgres:5432/leetcode_platform
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=25                         # 25 per worker
      - DB_MAX_OVERFLOW=20
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=180
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/reports:/app/backend/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - production_net
    deploy:
      resources:
        limits:
          cpus: '7.0'                           # Allocates up to 7 dedicated cores on an 8-CPU server
          memory: 12G

  # 3. High-Throughput PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: nandha_postgres_db
    restart: always
    environment:
      POSTGRES_DB: leetcode_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: SuperSecretPass2026
    command: >
      postgres
        -c max_connections=600
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c maintenance_work_mem=512MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=32MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=300
        -c work_mem=32MB
        -c min_wal_size=2GB
        -c max_wal_size=8GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - production_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d leetcode_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # 4. In-Memory Distributed Cache (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: nandha_redis_cache
    restart: always
    command: redis-server --maxmemory 1024mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    volumes:
      - redisdata:/data
    networks:
      - production_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1.5G

volumes:
  pgdata:
  redisdata:
  certbot-challenge:

networks:
  production_net:
    driver: bridge
