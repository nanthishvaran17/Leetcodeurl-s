name: Build & Package Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'


      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Make Gradle Executable & Build APK & Play Store AAB Bundle
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD || 'NEC@2024secure' }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD || 'NEC@2024secure' }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS || 'nandha-key' }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nandha-LeetCode-PlayStore-Release.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nandha-LeetCode-Intelligence-release.apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Rename Release Outputs for Distribution
        if: success()
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p dist-release
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist-release/Nandha_LeetCode_Intelligence_v${VERSION}_latest.apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist-release/nandha-leetcode.apk
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab dist-release/Nandha-LeetCode-PlayStore-Release.aab

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Nandha LeetCode Intelligence v${{ env.APP_VERSION }} (Production Release)"
          body: |
            ### 🚀 Official Production Release v${{ env.APP_VERSION }} (VersionCode 103)
            - **🏛️ Multi-Department HOD Access & Interactive Switcher**: Full support for Head of Department users overseeing multiple departments (e.g., CSE(CS) & CSE(IOT)). Department switching now works seamlessly across LandingPage, Department Dashboard, and HOD Command Center without snapping back.
            - **🔄 Instant Scope Synchronization**: Admin panel staff allocation changes immediately propagate and sync authorized department scope to the client without requiring manual re-login.
            - **✨ Universal Department Filter Normalization**: Integrated `MY_DEPARTMENTS` (`ALL`) support into `filterUtils` for flawless student filtering across single or combined department views.
            - **📱 Production Android Release v${{ env.APP_VERSION }}**: Native Capacitor 7 Release APK with full APK Signature Scheme v2 & v3 + 4-byte zipalign, verified across Android 11–16.
            - **Target SDK 36 (Android 16)** Google Play Ready
            - **ProGuard / R8 Optimization** active lean release APK
            - **Restricted permissions removed** for 100% Play Store policy compliance
          files: |
            dist-release/Nandha_LeetCode_Intelligence_v*.apk
            dist-release/nandha-leetcode.apk
            dist-release/Nandha-LeetCode-PlayStore-Release.aab
          prerelease: false
          generate_release_notes: true

