name: Build & Package Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'


      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Make Gradle Executable & Build APK & Play Store AAB Bundle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nandha-LeetCode-PlayStore-Release.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nandha-LeetCode-Intelligence-release.apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

