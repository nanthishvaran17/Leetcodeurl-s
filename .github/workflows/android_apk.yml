name: Build & Package Android APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Make Gradle Executable & Build APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nandha-LeetCode-Intelligence-v2.2.0-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
