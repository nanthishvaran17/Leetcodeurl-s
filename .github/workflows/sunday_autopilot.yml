name: Sunday Contest Autopilot Pipeline

on:
  schedule:
    # 07:55 AM IST (02:25 UTC) — Phase 1: Pre-Flight & Roster Freeze
    - cron: '25 2 * * 0'
    # 08:00 AM IST (02:30 UTC) — Phase 2: Baseline & Live Contest Start
    - cron: '30 2 * * 0'
    # 09:30 AM IST (04:00 UTC) — Phase 4: Phase 1 Lock & Finalization
    - cron: '0 4 * * 0'
    # 10:00 PM IST (16:30 UTC) — Phase 7: Virtual Contest Sync
    - cron: '30 16 * * 0'
    # Monday 07:45 AM IST (02:15 UTC) — Phase 5: Master Reports & Email Dispatch
    - cron: '15 2 * * 1'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Autopilot Phase to Execute'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'preflight_0755'
          - 'baseline_0800'
          - 'finalization_0930'
          - 'reports_0935'
          - 'virtual_sync_2200'

jobs:
  sunday_autopilot:
    name: Execute Sunday Autopilot Phase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      TIMEZONE: Asia/Kolkata
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Cairo & Pango for PDF generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sunday Automation Runner
        run: |
          python sunday_automation_complete.py
