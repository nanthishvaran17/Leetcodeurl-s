name: Weekly LeetCode Full Sync Worker

on:
  schedule:
    # Daily at 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  leetcode_sync_worker:
    name: Run Full LeetCode Sync Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
      ENVIRONMENT: production
      TIMEZONE: Asia/Kolkata
      CONCURRENCY_WORKERS: 15
      REQUEST_DELAY: 0.3
      DB_CONNECT_TIMEOUT: 15
      DB_POOL_TIMEOUT: 45
      DB_POOL_RECYCLE: 120

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          python -c "
          import time, sys
          for attempt in range(1, 4):
              try:
                  from backend.migrate_db import run_db_migrations
                  from backend.database import run_migrations
                  from backend.scripts.fix_all_pg_sequences import fix_all_sequences
                  run_db_migrations()
                  run_migrations()
                  fix_all_sequences()
                  print('✅ Database migrations and sequences successfully applied.')
                  break
              except Exception as e:
                  print(f'Attempt {attempt}/3 migration error: {e}')
                  if attempt == 3:
                      sys.exit(1)
                  time.sleep(5)
          "

      - name: Execute Sync Worker
        run: |
          python -c "
          import asyncio, time, sys
          for attempt in range(1, 4):
              try:
                  from backend.database import engine
                  engine.dispose()
                  from backend.sync_engine import run_full_sync
                  asyncio.run(run_full_sync())
                  print('✅ Sync worker completed successfully.')
                  break
              except Exception as e:
                  print(f'Attempt {attempt}/3 sync error: {e}')
                  if attempt == 3:
                      sys.exit(1)
                  time.sleep(10)
          "

