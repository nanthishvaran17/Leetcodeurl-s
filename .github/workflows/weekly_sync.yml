name: Weekly LeetCode Full Sync Worker

on:
  schedule:
    # Daily at 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  leetcode_sync_worker:
    name: Run Full LeetCode Sync Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONPATH: .
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
      ENVIRONMENT: production
      TIMEZONE: Asia/Kolkata
      CONCURRENCY_WORKERS: 15
      REQUEST_DELAY: 0.3

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          python -c "
          from backend.migrate_db import run_db_migrations
          from backend.database import run_migrations
          from backend.scripts.fix_all_pg_sequences import fix_all_sequences
          run_db_migrations()
          run_migrations()
          fix_all_sequences()
          print('✅ Database migrations and sequences successfully applied.')
          "

      - name: Execute Sync Worker
        run: |
          python -c "
          import asyncio
          from backend.database import SessionLocal
          from backend.sync_engine import run_full_sync
          with SessionLocal() as db:
              asyncio.run(run_full_sync(db))
          "

