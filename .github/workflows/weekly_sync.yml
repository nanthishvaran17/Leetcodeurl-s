name: Weekly LeetCode Full Sync Worker

on:
  schedule:
    # Daily at 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  leetcode_sync_worker:
    name: Run Full LeetCode Sync Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      TIMEZONE: Asia/Kolkata
      CONCURRENCY_WORKERS: 15
      REQUEST_DELAY: 0.3

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sync Worker
        run: |
          python -c "
          import asyncio
          from backend.database import SessionLocal
          from backend.sync_engine import run_full_sync
          with SessionLocal() as db:
              asyncio.run(run_full_sync(db))
          "
