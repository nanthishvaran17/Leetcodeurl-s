name: Performance Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiohttp psycopg2-binary

      - name: Start FastAPI Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Provide mock env vars for benchmark
          SECRET_KEY: "mock_secret_key"
          ENVIRONMENT: "development"
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl -s http://127.0.0.1:8000/api/health || echo "API failed to start"

      - name: Run API Benchmarks
        run: |
          python benchmark_suite.py > api_benchmark_results.txt
          cat api_benchmark_results.txt

      - name: Run Database Benchmarks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python benchmark_db.py > db_benchmark_results.txt
          cat db_benchmark_results.txt || echo "DB benchmark failed (did you set DATABASE_URL secret?)"

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Lighthouse CI
        run: |
          cd frontend
          npm install -g @lhci/cli
          lhci autorun --collect.staticDistDir="./dist" --collect.numberOfRuns=3 --upload.target="temporary-public-storage" > ../lighthouse_results.txt || true
          cat ../lighthouse_results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            api_benchmark_results.txt
            db_benchmark_results.txt
            lighthouse_results.txt
