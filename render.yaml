services:
  - type: web
    name: leetcodeurl-s
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: VITE_FIREBASE_PROJECT_ID
        value: leetcode-student-data
