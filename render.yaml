services:
  - type: web
    name: leetcode-tracker-api
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leetcode-tracker-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "https://your-vercel-frontend-url.vercel.app"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: leetcode-tracker-db
    region: singapore
    plan: free
    postgresMajorVersion: 15
