[project]
name = "college-leetcode-tracker"
version = "0.1.0"
description = "College LeetCode Performance Tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.24.0",
    "pyjwt>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyotp>=2.8.0",
    "python-multipart>=0.0.6",
    "qrcode>=7.4.2",
    "pillow>=9.5.0",
    "pytz>=2023.3",
]

[tool.vercel]
entrypoint = "backend.main:app"
