# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process with parallel GC and 4GB heap
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# Parallel execution across CPU cores
org.gradle.parallel=true

# Enable build cache for instantaneous rebuilds of unchanged tasks
org.gradle.caching=true

# Keep Gradle daemon alive for instant warm builds
org.gradle.daemon=true

# Enable file system watching to skip redundant disk checks
org.gradle.vfs.watch=true

# AndroidX package structure
android.useAndroidX=true

