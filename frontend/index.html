<!DOCTYPE html>

<head>

  <meta name="google-site-verification" content="j5T3g22m7ih2TueJ2fH_ugLTzPIpeeMTjuQpV10ILFc" />
  <meta charset="UTF-8" />

  <!-- Favicon Configuration -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Theme Colors (system-adaptive) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

  <!-- Viewport — viewport-fit=cover is required for notch/cutout & safe-area-inset-* on Android/iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

  <!-- Apple / iOS PWA / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nandha Intelligence" />
  <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />

  <!-- Android / Chrome PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Nandha Intelligence" />

  <!-- Microsoft Tile (Edge / Windows) -->
  <meta name="msapplication-TileColor" content="#0f172a" />
  <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
  <meta name="msapplication-navbutton-color" content="#0f172a" />

  <!-- Network Optimization for Backend & Google APIs -->
  <link rel="dns-prefetch" href="https://leetcodeurl-s-3mig.onrender.com" />
  <link rel="preconnect" href="https://leetcodeurl-s-3mig.onrender.com" />
  <link rel="dns-prefetch" href="https://apis.google.com" />
  <link rel="preconnect" href="https://apis.google.com" crossorigin />

  <!-- LCP Image Preload — mobile only (max-width: 899px) -->
  <link rel="preload" as="image" href="/nandha_aerial_bg_mobile.webp" type="image/webp" media="(max-width: 899px)" fetchpriority="high" />

  <!-- Fonts — Non-blocking & Swapped -->
  <!-- Inter: critical for login page above-the-fold -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>
  <!-- JetBrains Mono: non-critical, only used in data/code views — load after LCP -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
  </noscript>

  <!-- SEO / Page Metadata -->
  <title>Nandha Intelligence</title>
  <meta name="title" content="Nandha Intelligence" />
  <meta name="description" content="NEC 25 Years of Excellence — LeetCode Tracker & Intelligence Platform for Nandha Engineering College, Erode. Track student performance, leaderboards, contests, and reports." />
  <meta name="keywords" content="Nandha Engineering College, LeetCode, tracker, intelligence, student performance, coding, competitive programming, NEC" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://leetcodeurl-s-roan.vercel.app/" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Nandha Intelligence" />
  <meta property="og:description" content="NEC 25 Years of Excellence — LeetCode Intelligence Platform for Nandha Engineering College." />
  <meta property="og:image" content="/pwa-512x512.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Nandha Intelligence" />
  <meta name="twitter:description" content="LeetCode Intelligence Platform — Nandha Engineering College." />
  <meta name="twitter:image" content="/pwa-512x512.png" />

  <!-- CRITICAL INLINE CSS: Eliminates blank white frame before React hydrates.
       Sets background color immediately so the first painted pixel matches the app shell.
       This is the smallest possible critical CSS — only what affects the first visible frame. -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body,#root{margin:0;padding:0;width:100%;min-height:100vh;background:#0f172a}
    #root{display:flex;flex-direction:column}
    /* Prevent FOUC on light-mode preference */
    @media(prefers-color-scheme:light){html,body,#root{background:#f8fafc}}
  </style>
</head>

<body
  class="bg-slate-50 text-slate-900 dark:bg-navy-950 dark:text-slate-100 transition-colors duration-200 antialiased font-sans">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
