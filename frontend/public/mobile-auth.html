<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google Authentication • Nandha LeetCode Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0B1B33;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: #0F1B2E;
      border: 1px solid #233550;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 52px;
      height: 52px;
      background: #13294B;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #38BDF8;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px 0 20px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.12);
      color: #38BDF8;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      box-sizing: border-box;
    }
    .btn-primary {
      background: #FFFFFF;
      color: #0B1B33;
    }
    .btn-primary:hover {
      background: #F1F5F9;
    }
    .btn-secondary {
      background: #152238;
      color: #94A3B8;
      margin-top: 10px;
      border: 1px solid #233550;
    }
    .error-box {
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #F87171;
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 16px;
      width: 100%;
      display: none;
    }
  </style>

  <!-- Firebase App & Auth SDK (Modular CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsP9hOeAxrIO5hbmlrPhmGa3p1vv-1Jek",
      authDomain: "leetcode-student-data.firebaseapp.com",
      projectId: "leetcode-student-data",
      storageBucket: "leetcode-student-data.firebasestorage.app",
      messagingSenderId: "384483144435",
      appId: "1:384483144435:web:bcc3284e79ed3ac5323d86"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const statusEl = document.getElementById('status-text');
    const subtitleEl = document.getElementById('subtitle-text');
    const spinnerEl = document.getElementById('spinner');
    const errorBoxEl = document.getElementById('error-box');
    const actionBtnEl = document.getElementById('action-btn');
    const cancelBtnEl = document.getElementById('cancel-btn');

    // Single-flight exchange guard
    let isExchangingToken = false;

    // Retrieve parameters with SessionStorage persistence
    const urlParams = new URLSearchParams(window.location.search);
    const scheme = urlParams.get('scheme') || sessionStorage.getItem('nec_auth_scheme') || 'org.nandhaengg.leetcodesync';
    const codeChallenge = urlParams.get('code_challenge') || sessionStorage.getItem('nec_auth_challenge') || '';
    const state = urlParams.get('state') || sessionStorage.getItem('nec_auth_state') || '';

    // Authoritative production backend API URL for native APK & mobile auth bridge
    const defaultProductionApi = 'https://leetcodeurl-s-3mig.onrender.com/api';
    let rawApiBase = urlParams.get('api_base') || sessionStorage.getItem('nec_auth_apibase') || '';
    if (!rawApiBase || rawApiBase.includes('vercel.app') || rawApiBase.includes('localhost')) {
      rawApiBase = defaultProductionApi;
    }
    const apiBase = rawApiBase;

    // Cache parameters in sessionStorage to survive redirect
    if (urlParams.get('scheme')) sessionStorage.setItem('nec_auth_scheme', scheme);
    if (urlParams.get('code_challenge')) sessionStorage.setItem('nec_auth_challenge', codeChallenge);
    if (urlParams.get('state')) sessionStorage.setItem('nec_auth_state', state);
    if (urlParams.get('api_base')) sessionStorage.setItem('nec_auth_apibase', apiBase);

    function returnToAppWithAuthCode(authCode, returnState) {
      const params = new URLSearchParams();
      params.set('code', authCode);
      params.set('state', returnState);
      
      const deepLink = `${scheme}://oauth-callback?${params.toString()}`;
      
      statusEl.innerText = "Returning to App...";
      subtitleEl.innerText = "Securing institutional session...";
      spinnerEl.style.display = 'none';

      // Clear cached parameters
      sessionStorage.removeItem('nec_auth_scheme');
      sessionStorage.removeItem('nec_auth_challenge');
      sessionStorage.removeItem('nec_auth_state');
      sessionStorage.removeItem('nec_auth_apibase');
      sessionStorage.removeItem('nec_auth_redirect_started');

      window.location.href = deepLink;

      actionBtnEl.style.display = 'inline-flex';
      actionBtnEl.innerText = "Open LeetCode Tracker App";
      actionBtnEl.onclick = () => { window.location.href = deepLink; };
    }

    function returnToAppWithError(errorMessage) {
      const params = new URLSearchParams();
      params.set('error', errorMessage);
      if (state) params.set('state', state);

      const deepLink = `${scheme}://oauth-callback?${params.toString()}`;
      window.location.href = deepLink;
    }

    function showError(message) {
      spinnerEl.style.display = 'none';
      errorBoxEl.style.display = 'block';
      errorBoxEl.innerText = message;
      statusEl.innerText = "Sign-In Notice";
      subtitleEl.innerText = "Google sign-in could not be completed. Please try again.";
      
      actionBtnEl.style.display = 'inline-flex';
      actionBtnEl.innerText = "Try Again";
      actionBtnEl.onclick = () => { 
        sessionStorage.removeItem('nec_auth_redirect_started');
        window.location.reload(); 
      };

      cancelBtnEl.style.display = 'inline-flex';
      cancelBtnEl.innerText = "Back to Sign In";
      cancelBtnEl.onclick = () => {
        sessionStorage.removeItem('nec_auth_redirect_started');
        returnToAppWithError('Google sign-in was cancelled.');
      };
    }

    async function handleIdToken(idToken) {
      statusEl.innerText = "Verifying Account...";
      subtitleEl.innerText = "Validating with institutional server...";
      console.log('[MOBILE AUTH] TOKEN_RESOLVED');
      console.log('[MOBILE AUTH] BACKEND_SESSION_STARTED Endpoint:', apiBase + '/auth/google/create-code');

      try {
        const res = await fetch(`${apiBase}/auth/google/create-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_token: idToken,
            code_challenge: codeChallenge,
            state: state
          })
        });

        const data = await res.json();

        if (!res.ok) {
          console.log('[MOBILE AUTH] AUTH_FAILED Status:', res.status);
          const detail = data?.detail || 'Your Google account is not registered with the institution.';
          showError(detail);
          returnToAppWithError(detail);
          return;
        }

        if (data && data.success && data.code) {
          console.log('[MOBILE AUTH] BACKEND_SESSION_SUCCESS PKCE Code Created');
          returnToAppWithAuthCode(data.code, data.state || state);
        } else {
          console.log('[MOBILE AUTH] AUTH_FAILED Missing code in response');
          showError('Unable to generate authorization code.');
          returnToAppWithError('Authorization code generation failed.');
        }
      } catch (err) {
        console.error('[MOBILE AUTH] AUTH_FAILED Fetch error:', err?.message || err);
        showError('Unable to complete sign-in. Please try again.');
        returnToAppWithError('Network error connecting to authentication server.');
      }
    }

    // Centralized Authentication Resolution Flow
    async function resolveFirebaseUser(authInstance) {
      statusEl.innerText = "Restoring Session...";
      subtitleEl.innerText = "Restoring institutional Google session...";

      // Step 1: Check getRedirectResult(auth)
      try {
        const redirectRes = await getRedirectResult(authInstance);
        if (redirectRes && redirectRes.user) {
          console.log('[MOBILE AUTH] Resolved user from getRedirectResult:', redirectRes.user.email);
          return redirectRes.user;
        }
      } catch (err) {
        console.warn('[MOBILE AUTH] getRedirectResult note:', err?.message || err);
      }

      // Step 2: Check authInstance.currentUser
      if (authInstance.currentUser) {
        console.log('[MOBILE AUTH] Resolved user from auth.currentUser:', authInstance.currentUser.email);
        return authInstance.currentUser;
      }

      // Step 3: Bounded wait for onAuthStateChanged restoration (up to 7 seconds)
      return new Promise((resolve) => {
        let isResolved = false;

        const unsubscribe = onAuthStateChanged(authInstance, (user) => {
          if (user && !isResolved) {
            isResolved = true;
            unsubscribe();
            console.log('[MOBILE AUTH] Resolved user from onAuthStateChanged:', user.email);
            resolve(user);
          }
        });

        // Periodic check for currentUser
        const pollInterval = setInterval(() => {
          if (authInstance.currentUser && !isResolved) {
            isResolved = true;
            clearInterval(pollInterval);
            unsubscribe();
            console.log('[MOBILE AUTH] Resolved user from auth.currentUser polling:', authInstance.currentUser.email);
            resolve(authInstance.currentUser);
          }
        }, 400);

        // Bounded timeout (7 seconds)
        setTimeout(() => {
          if (!isResolved) {
            isResolved = true;
            clearInterval(pollInterval);
            unsubscribe();
            console.warn('[MOBILE AUTH] User resolution wait elapsed without active user');
            resolve(null);
          }
        }, 7000);
      });
    }

    async function startAuth() {
      // Safety timeout: 20 seconds maximum wait to guarantee no infinite spinner
      const safetyTimeout = setTimeout(() => {
        if (!isExchangingToken && spinnerEl && spinnerEl.style.display !== 'none') {
          showError('Google sign-in could not be completed. Please try again.');
        }
      }, 20000);

      try {
        console.log('[MOBILE AUTH] Mobile authentication bridge started');
        const isRedirectingBack = !!sessionStorage.getItem('nec_auth_redirect_started');

        if (isRedirectingBack) {
          // Returning from Google OAuth redirect
          const user = await resolveFirebaseUser(auth);

          if (user) {
            clearTimeout(safetyTimeout);
            sessionStorage.removeItem('nec_auth_redirect_started');
            if (isExchangingToken) return;
            isExchangingToken = true;

            const token = await user.getIdToken(true);
            await handleIdToken(token);
            return;
          }

          // If no user resolved after returning from redirect:
          clearTimeout(safetyTimeout);
          sessionStorage.removeItem('nec_auth_redirect_started');
          showError('Google sign-in could not be completed. Please try again.');
          return;
        }

        // Fresh page load check — check if Firebase user is already active
        const existingUser = await resolveFirebaseUser(auth);
        if (existingUser) {
          clearTimeout(safetyTimeout);
          if (isExchangingToken) return;
          isExchangingToken = true;

          const token = await existingUser.getIdToken(true);
          await handleIdToken(token);
          return;
        }

        // Initiate Google OAuth Redirect
        sessionStorage.setItem('nec_auth_redirect_started', '1');
        statusEl.innerText = "Connecting to Google...";
        subtitleEl.innerText = "Opening Google account selector...";
        await signInWithRedirect(auth, provider);
      } catch (err) {
        clearTimeout(safetyTimeout);
        sessionStorage.removeItem('nec_auth_redirect_started');
        console.error('[MOBILE AUTH] Bridge error:', err);
        const code = err?.code || '';
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
          returnToAppWithError('Google sign-in was cancelled.');
        } else {
          showError(err?.message || 'Google sign-in could not be completed. Please try again.');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      startAuth();
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="eyebrow">NANDHA ENGINEERING COLLEGE</div>
    <h1 class="title">Institutional Google Sign-In</h1>
    <p class="subtitle" id="subtitle-text">Authenticating through official Google service...</p>

    <div class="status-badge" id="status-badge">
      <span id="status-text">Authorizing Session</span>
    </div>

    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="error-box"></div>

    <button type="button" class="btn btn-primary" id="action-btn" style="display: none;">Open App</button>
    <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
  </div>
</body>
</html>
