<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Google Authentication • Nandha LeetCode Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0B1B33;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: #0F1B2E;
      border: 1px solid #233550;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 52px;
      height: 52px;
      background: #13294B;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #38BDF8;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px 0 20px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.12);
      color: #38BDF8;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      box-sizing: border-box;
    }
    .btn-primary {
      background: #FFFFFF;
      color: #0B1B33;
    }
    .btn-primary:hover {
      background: #F1F5F9;
    }
    .btn-secondary {
      background: #152238;
      color: #94A3B8;
      margin-top: 10px;
      border: 1px solid #233550;
    }
    .error-box {
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #F87171;
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 16px;
      width: 100%;
      display: none;
    }
  </style>

  <!-- Firebase App & Auth SDK (Modular CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsP9hOeAxrIO5hbmlrPhmGa3p1vv-1Jek",
      authDomain: "leetcode-student-data.firebaseapp.com",
      projectId: "leetcode-student-data",
      storageBucket: "leetcode-student-data.firebasestorage.app",
      messagingSenderId: "384483144435",
      appId: "1:384483144435:web:bcc3284e79ed3ac5323d86"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const statusEl = document.getElementById('status-text');
    const subtitleEl = document.getElementById('subtitle-text');
    const spinnerEl = document.getElementById('spinner');
    const errorBoxEl = document.getElementById('error-box');
    const actionBtnEl = document.getElementById('action-btn');
    const cancelBtnEl = document.getElementById('cancel-btn');

    // Get parameters
    const urlParams = new URLSearchParams(window.location.search);
    const scheme = urlParams.get('scheme') || 'org.nandhaengg.leetcodesync';
    const codeChallenge = urlParams.get('code_challenge') || '';
    const state = urlParams.get('state') || '';
    const apiBase = urlParams.get('api_base') || (window.location.origin.includes('localhost') ? 'http://localhost:8000/api' : (window.location.origin + '/api'));

    function returnToAppWithAuthCode(authCode, returnState) {
      // RFC 7636 PKCE Compliant Callback: Only authorization code + state parameter.
      // ZERO sensitive tokens, access keys, or credentials in deep link URL!
      const params = new URLSearchParams();
      params.set('code', authCode);
      params.set('state', returnState);
      
      const deepLink = `${scheme}://oauth-callback?${params.toString()}`;
      
      statusEl.innerText = "Returning to App...";
      subtitleEl.innerText = "Securing institutional session...";
      spinnerEl.style.display = 'none';

      window.location.href = deepLink;

      actionBtnEl.style.display = 'inline-flex';
      actionBtnEl.innerText = "Open LeetCode Tracker App";
      actionBtnEl.onclick = () => { window.location.href = deepLink; };
    }

    function returnToAppWithError(errorMessage) {
      const params = new URLSearchParams();
      params.set('error', errorMessage);
      if (state) params.set('state', state);

      const deepLink = `${scheme}://oauth-callback?${params.toString()}`;
      window.location.href = deepLink;
    }

    function showError(message) {
      spinnerEl.style.display = 'none';
      errorBoxEl.style.display = 'block';
      errorBoxEl.innerText = message;
      statusEl.innerText = "Sign-In Notice";
      subtitleEl.innerText = "Please choose an action below.";
      
      actionBtnEl.style.display = 'inline-flex';
      actionBtnEl.innerText = "Try Again";
      actionBtnEl.onclick = () => { window.location.reload(); };

      cancelBtnEl.style.display = 'inline-flex';
      cancelBtnEl.onclick = () => {
        returnToAppWithError('cancelled');
      };
    }

    async function handleIdToken(idToken) {
      statusEl.innerText = "Verifying Account...";
      subtitleEl.innerText = "Validating with institutional server...";

      try {
        const res = await fetch(`${apiBase}/auth/google/create-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_token: idToken,
            code_challenge: codeChallenge,
            state: state
          })
        });

        const data = await res.json();

        if (!res.ok) {
          const detail = data?.detail || 'Your Google account is not registered with the institution.';
          showError(detail);
          returnToAppWithError(detail);
          return;
        }

        if (data && data.success && data.code) {
          returnToAppWithAuthCode(data.code, data.state || state);
        } else {
          showError('Unable to generate authorization code.');
          returnToAppWithError('Authorization code generation failed.');
        }
      } catch (err) {
        showError('Network error connecting to institutional server.');
        returnToAppWithError('Network error connecting to authentication server.');
      }
    }

    async function startAuth() {
      try {
        // 1. Check if returning from redirect flow first
        const redirectRes = await getRedirectResult(auth).catch(() => null);
        if (redirectRes && redirectRes.user) {
          const token = await redirectRes.user.getIdToken(true);
          await handleIdToken(token);
          return;
        }

        // 2. Trigger Google Sign-In Popup in Chrome Custom Tab
        const cred = await signInWithPopup(auth, provider);
        if (cred && cred.user) {
          const token = await cred.user.getIdToken(true);
          await handleIdToken(token);
        }
      } catch (err) {
        const code = err?.code || '';
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
          returnToAppWithError('cancelled');
        } else if (code === 'auth/popup-blocked') {
          await signInWithRedirect(auth, provider);
        } else {
          const msg = err?.message || 'Google sign-in was cancelled.';
          showError(msg);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      startAuth();
    });
  </script>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="eyebrow">NANDHA ENGINEERING COLLEGE</div>
    <h1 class="title">Institutional Google Sign-In</h1>
    <p class="subtitle" id="subtitle-text">Authenticating through official Google service...</p>

    <div class="status-badge" id="status-badge">
      <span id="status-text">Authorizing Session</span>
    </div>

    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="error-box"></div>

    <button type="button" class="btn btn-primary" id="action-btn" style="display: none;">Open App</button>
    <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
  </div>
</body>
</html>
